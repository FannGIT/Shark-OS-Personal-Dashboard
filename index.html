<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦈 Shark-OS | Dashboard Pribadi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<!-- MUSIC PLAYER -->
<div class="music-player collapsed" id="musicPlayer" onclick="toggleMusicPlayer()">
    <div class="music-visualizer paused" id="musicVisualizer">
        <div class="music-bar"></div>
        <div class="music-bar"></div>
        <div class="music-bar"></div>
        <div class="music-bar"></div>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="music/lofi1.mp3" type="audio/mpeg">
</audio>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-icon" onclick="navigateTo('dashboard')">🦈</div>
        <div class="sidebar-logo-text">
            <h2>Shark-OS</h2>
            <span>Dashboard</span>
        </div>
    </div>
    
    <div class="sidebar-user" onclick="navigateTo('profile')">
        <div class="sidebar-user-avatar" id="sidebarAvatar">R</div>
        <div class="sidebar-user-info">
            <p id="sidebarName">Fannn</p>
            <span id="sidebarRole">Admin</span>
        </div>
    </div>
    
    <nav class="sidebar-nav">
        <a onclick="navigateTo('about')" id="navAbout">
            <span class="icon">ℹ️</span> Tentang
        </a>
        <span class="sidebar-nav-label">Menu</span>
        <a onclick="navigateTo('dashboard')" class="active" id="navDashboard">
            <span class="icon">⭐</span> The-Reef
        </a>
        <a onclick="navigateTo('scheduler')" id="navScheduler">
            <span class="icon">🌊</span> The-Wave
        </a>
        <a onclick="navigateTo('finance')" id="navFinance">
            <span class="icon">💰</span> Keuangan
        </a>
        <a onclick="navigateTo('snaps')" id="navSnaps">
            <span class="icon">📸</span> Shark-Snap
        </a>
        <a onclick="navigateTo('profile')" id="navProfile">
            <span class="icon">👤</span> Profil
            <span class="achievement-badge-sidebar" id="achievementCount" style="display:none;">0</span>
        </a>
    </nav>
    
    <div class="sidebar-footer">
        <a onclick="logout()">
            <span class="icon">🚪</span> Keluar
        </a>
    </div>
</aside>

<!-- MOBILE TOGGLE -->
<button id="mobileToggle" onclick="document.getElementById('sidebar').classList.toggle('open'); event.stopPropagation();">
    🦈
</button>

<!-- MAIN CONTENT -->
<main class="main-content" id="mainContent"></main>

<!-- MODAL CONTAINER -->
<div id="modalContainer"></div>

<!-- NOTIFICATION CONTAINER -->
<div class="notification" id="notificationContainer"></div>

<script src="script.js"></script>
</body>
</html>
